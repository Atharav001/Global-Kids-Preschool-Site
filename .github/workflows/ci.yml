name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Build
        run: npm run build

      - name: Run Launch Check & Quality Gates
        run: npm test

      - name: Upload Deployment Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-packages
          path: |
            dist/*.zip
